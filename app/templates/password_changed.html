<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLOWLENS | Set New Password</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="page-shell">
    <div class="auth-layout">
      <section class="hero-panel">
        <div class="hero-top">
          <div class="brand-badge">
            <span class="brand-dot"></span>
            FLOWLENS
          </div>
        </div>

        <div class="hero-card">
          <p class="hero-eyebrow">Set New Password</p>
          <h1 class="hero-title">Create a stronger password.</h1>
          <p class="hero-subtitle">
            Use a secure password and continue with a polished recovery flow.
          </p>
        </div>
      </section>

      <section class="form-panel">
        <div class="form-card">
          <div class="form-header">
            <h2 class="form-title">Set New Password</h2>
            <p class="form-subtitle">
              Create and confirm your new password below.
            </p>
          </div>

          {% if error %}
          <div class="error-box">{{ error }}</div>
          {% endif %}

          <form method="post" action="/reset">
            <div class="input-group">
              <label class="input-label">New Password</label>
              <div class="input-wrap">
                <input id="password" class="text-input" type="password" name="password" placeholder="Create new password" required />
                <button type="button" class="eye-btn" data-toggle-password="password">◉</button>
              </div>

              <div class="strength-wrap">
                <div class="strength-bar">
                  <div class="strength-fill" id="strengthFill"></div>
                </div>
                <div class="strength-text" id="strengthText">Password strength: Easy</div>
              </div>
            </div>

            <div class="input-group">
              <label class="input-label">Confirm Password</label>
              <div class="input-wrap">
                <input id="confirm_password" class="text-input" type="password" name="confirm_password" placeholder="Re-enter password" required />
                <button type="button" class="eye-btn" data-toggle-password="confirm_password">◉</button>
              </div>
            </div>

            <button class="primary-btn" type="submit">Reset Password</button>
          </form>
        </div>
      </section>
    </div>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
